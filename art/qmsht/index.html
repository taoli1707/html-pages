<title>清明上河图 3D</title>
<meta name="description" content="张择端《清明上河图》的可漫游三维重建：按原卷顺序复原郊野、汴河虹桥、城门与市井三十多个场景，人物、船只、车马均按画中内容动态演出。">
<style>
  :root{--paper:#e9e1cc;--ink:#2b2520;--ink2:#5a4e40;--accent:#9c3b2b;--panel:rgba(249,244,232,.94);--line:#c9bda3}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:"Songti SC","STSong","Noto Serif SC","PingFang SC",Georgia,serif}
  #c{position:fixed;inset:0;display:block}
  #ui{position:fixed;inset:0;pointer-events:none}
  #ui>*{pointer-events:auto}
  #title{position:absolute;left:16px;top:12px;max-width:min(60vw,520px)}
  #title h1{margin:0;font-size:22px;letter-spacing:.12em;font-weight:600}
  #title p{margin:4px 0 0;font-size:12px;color:var(--ink2);line-height:1.5}
  #toolbar{position:absolute;right:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:48vw}
  button{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #panel{position:absolute;left:16px;bottom:96px;width:min(92vw,420px);max-height:46vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.12);display:none}
  #panel.show{display:block}
  #panel h2{margin:0 0 2px;font-size:18px;letter-spacing:.06em}
  #panel .en{font-size:13px;color:var(--ink2);margin:0 0 6px;font-style:italic}
  #panel .meta{font-size:11px;color:var(--ink2);margin-bottom:8px}
  #panel p{margin:0 0 8px;font-size:14px;line-height:1.65}
  #panel .nav{display:flex;gap:6px;justify-content:space-between;margin-top:6px}
  #strip{position:absolute;left:0;right:0;bottom:0;height:84px;background:rgba(43,37,32,.85);display:flex;flex-direction:column;justify-content:flex-end}
  #stripScroll{overflow-x:auto;overflow-y:hidden;height:66px;scrollbar-width:thin}
  #stripInner{position:relative;height:60px;width:4000px;margin:3px 0}
  #stripImg{position:absolute;left:0;top:0;height:60px;width:4000px;display:block;filter:sepia(.2)}
  .mk{position:absolute;top:0;width:2px;height:60px;background:rgba(255,235,180,.75);cursor:pointer}
  .mk:hover,.mk.on{background:#ffb347;width:3px}
  .mk span{position:absolute;top:2px;left:4px;font-size:10px;color:#ffe9b8;white-space:nowrap;background:rgba(0,0,0,.45);padding:1px 3px;border-radius:3px}
  #cursor{position:absolute;top:0;height:60px;width:0;border-left:2px dashed #ff5e3a;pointer-events:none}
  #stripHint{font-size:11px;color:#e8dcc3;padding:1px 10px 0;height:18px;line-height:18px}
  #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:var(--paper);z-index:10;font-size:16px;letter-spacing:.2em}
  #loading .bar{width:220px;height:3px;background:#d8ccb0;margin-top:14px}
  #loading .bar i{display:block;height:100%;width:0;background:var(--accent)}
  .lbl{font-size:12px;color:#fff;background:rgba(43,37,32,.72);padding:2px 7px;border-radius:4px;white-space:nowrap;letter-spacing:.05em;pointer-events:none}

  @media (max-width:640px){#title h1{font-size:17px}#title p{display:none}#help{display:none}#panel{bottom:90px;max-height:38vh}}

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}

<body>
<canvas id="c"></canvas>
<div id="loading">清明上河图<div class="bar"><i id="bar"></i></div></div>
<div id="ui">
  <div id="title"><h1>清明上河图 · 三维漫游</h1><p>张择端原卷（故宫博物院藏，24.8 × 528 cm）的可漫游复原。从右到左按原卷顺序排布：郊野、汴河虹桥、城门与市井。点击人物或场景可查看它在画中的位置与出处。</p></div>
  <div id="toolbar">

  </div>

    <h2 id="pZh"></h2><p class="en" id="pEn"></p><div class="meta" id="pMeta"></div><p id="pText"></p>
    <div class="nav"><button id="btnPrev">◀ 上一景</button><span id="pIdx" style="font-size:12px;align-self:center;color:var(--ink2)"></span><button id="btnNext">下一景 ▶</button></div>
  </div>
  <div id="help">拖动旋转 · 滚轮缩放 · 右键/双指平移 · WASD 移动<br>下方长卷是原画缩略图，点击任意位置即飞到对应场景</div>
  <div id="tip"></div>
  <div id="strip"><div id="stripScroll"><div id="stripInner"><img id="stripImg" src="scroll_strip.jpg" alt="清明上河图 原卷缩略"><div id="cursor"></div></div></div><div id="stripHint">原卷（右为卷首）· 竖线为场景标记 · 虚线为当前视点</div></div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const PAPER = 0xe9e1cc;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = innerWidth > 700;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
const labelRenderer = new CSS2DRenderer(); labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.cssText = 'position:fixed;inset:0;pointer-events:none;';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAPER);
scene.fog = new THREE.FogExp2(PAPER, 0.0032);
const camera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, 0.5, 900);
camera.position.set(40, 26, 48);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 3, 0); controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = Math.PI*0.49; controls.minDistance = 4; controls.maxDistance = 420;
controls.addEventListener('start', () => stopTour());

scene.add(new THREE.HemisphereLight(0xf4ecd8, 0x8f8160, 1.4));
const sun = new THREE.DirectionalLight(0xfff1d6, 2.4); sun.position.set(-60, 110, 80);
sun.castShadow = renderer.shadowMap.enabled; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {near:10, far:400, left:-110, right:110, top:110, bottom:-110}); sun.shadow.bias = -0.0008;
scene.add(sun); scene.add(sun.target);

// ---------- helpers: Blender (x,y,z up) -> three (x, z, -y)
const toV3 = p => new THREE.Vector3(p[0], p[2], -p[1]);
class Path {
  constructor(pts){ this.pts = pts.map(toV3); this.cum=[0]; for (let i=1;i<this.pts.length;i++) this.cum[i]=this.cum[i-1]+this.pts[i].distanceTo(this.pts[i-1]); this.len=this.cum[this.cum.length-1]; }
  seg(d){ let lo=0, hi=this.cum.length-1; while (hi-lo>1){ const m=(lo+hi)>>1; if (this.cum[m]<=d) lo=m; else hi=m; } return lo; }
  at(d, out, tan){
    d = Math.max(0, Math.min(this.len, d)); const i=this.seg(d); const a=this.pts[i], b=this.pts[Math.min(i+1,this.pts.length-1)];
    const L=this.cum[i+1]-this.cum[i] || 1; const t=(d-this.cum[i])/L; out.lerpVectors(a,b,t);
    if (tan){ tan.subVectors(b,a); if (tan.lengthSq()<1e-9){ const a2=this.pts[Math.max(i-1,0)]; tan.subVectors(b,a2);} tan.y=0; tan.normalize(); }
    return out;
  }
}
const ZQ = new THREE.Quaternion(), YQ = new THREE.Quaternion(), XQ = new THREE.Quaternion(), TMP = new THREE.Quaternion();
const AX=new THREE.Vector3(1,0,0), AY=new THREE.Vector3(0,1,0), AZ=new THREE.Vector3(0,0,1);
function setYawLean(obj, yaw, lean, extraPitch=0){ obj.quaternion.setFromAxisAngle(AY, yaw); if (lean||extraPitch){ ZQ.setFromAxisAngle(AZ, -(lean+extraPitch)); obj.quaternion.multiply(ZQ);} }
function limbSwing(limb, angleZ, angleX=0){ if(!limb) return; limb.quaternion.copy(limb.userData.base); if (angleZ){ ZQ.setFromAxisAngle(AZ, angleZ); limb.quaternion.multiply(ZQ);} if (angleX){ XQ.setFromAxisAngle(AX, angleX); limb.quaternion.multiply(XQ);} }
const tri = x => { x = x % 2; if (x<0) x+=2; return x<1 ? x : 2-x; };

// ---------- load
let manifest, paths = {}, actors = [], vignettes = [], ropeLines = [], swayMats = [], waterMat;
const loader = new GLTFLoader();
loader.load('qmsht.glb', gltf => {
  const root = gltf.scene; scene.add(root);
  manifest = JSON.parse(root.userData.manifest);
  for (const k in manifest.paths) paths[k] = new Path(manifest.paths[k]);
  vignettes = manifest.vignettes;
  root.traverse(o => {
    if (o.isMesh){
      o.castShadow = true; o.receiveShadow = true;
      if (o.name === 'terrain' || o.name === 'water' || o.name === 'roads'){ o.castShadow = false; }
      if (o.name === 'water'){ makeWater(o); }
      if (o.name === 'foliage'){ o.castShadow = false; o.material.forEach ? o.material.forEach(addSway) : addSway(o.material); }
      if (o.name === 'terrain' || o.name === 'static' || o.name === 'roads' || o.name === 'foliage'){ o.frustumCulled = false; }
    }
    if (o.userData.anim !== undefined){
      let a = o.userData.anim; if (typeof a === 'string'){ try { a = JSON.parse(a);} catch(e){ a={type:'idle'}; } }
      registerActor(o, a);
    }
  });
  buildStrip(); buildLabels();
  document.getElementById('loading').style.display = 'none';
  showVignette(vignettes.findIndex(v => v.id === 'v14'), false);
}, xhr => { if (xhr.total) document.getElementById('bar').style.width = (100*xhr.loaded/xhr.total)+'%'; },
   err => { document.getElementById('loading').textContent = '加载失败: ' + err; });

function addSway(m){ if (!m) return; m.userData.sway = true; m.onBeforeCompile = sh => { sh.uniforms.uTime = uTime; sh.vertexShader = 'uniform float uTime;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n float swy = clamp((position.y-1.5)/6.0, 0.0, 1.0); transformed.x += sin(uTime*1.1 + position.x*0.21 + position.z*0.17)*0.22*swy; transformed.z += cos(uTime*0.9 + position.x*0.13)*0.12*swy;'); }; m.needsUpdate = true; }
const uTime = {value: 0};
function makeWater(o){
  waterMat = new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, side:THREE.DoubleSide, uniforms:{uTime, fogColor:{value:new THREE.Color(PAPER)}, fogDensity:{value:0.0032}},
    vertexShader:`varying vec3 vW; varying float vD; void main(){ vec4 w = modelMatrix*vec4(position,1.0); vW=w.xyz; vec4 mv = viewMatrix*w; vD = -mv.z; gl_Position = projectionMatrix*mv; }`,
    fragmentShader:`uniform float uTime; uniform vec3 fogColor; uniform float fogDensity; varying vec3 vW; varying float vD;
      void main(){ float r1 = sin(vW.x*2.1 + vW.z*0.9 + uTime*1.1); float r2 = sin(vW.x*0.7 - vW.z*2.3 - uTime*0.6); float r3 = sin(vW.x*0.35 + vW.z*0.5 + uTime*0.35); float rip = smoothstep(0.80,0.98,r1*r2) * (0.6+0.4*r3);
        vec3 base = mix(vec3(0.49,0.60,0.57), vec3(0.62,0.70,0.64), 0.5+0.5*sin(vW.x*0.08+vW.z*0.05+uTime*0.15));
        vec3 col = mix(base, vec3(0.80,0.84,0.76), rip*0.35);
        float f = 1.0 - exp(-fogDensity*fogDensity*vD*vD); col = mix(col, fogColor, f);
        gl_FragColor = vec4(col, 0.9); }`
  });
  o.material = waterMat; o.receiveShadow = false; o.renderOrder = 1;
}

function registerActor(node, anim){
  const limbs = {};
  for (const ch of node.children){
    const suf = ch.name.startsWith(node.name) ? ch.name.slice(node.name.length).replace(/^[._]/,'') : ch.name;   // GLTFLoader strips the '.' from Blender names
    if (['armL','armR','legL','legR','legFL','legFR','legBL','legBR','mast','oar','bucket','body','hull'].includes(suf)) limbs[suf] = ch;
    if (suf.startsWith('wheel')){ (limbs.wheels = limbs.wheels || []).push(ch); }
    ch.userData.base = ch.quaternion.clone();
  }
  node.userData.base = node.quaternion.clone();
  const a = { node, anim, limbs, t0: Math.random()*10, d:0, path: anim.path ? paths[anim.path] : null, kind: node.userData.kind || '' };
  if (!a.path && anim.path) console.warn('missing path', anim.path);
  if (anim.rope_to){ const g = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]); const line = new THREE.Line(g, new THREE.LineBasicMaterial({color:0x7a6a4a})); scene.add(line); ropeLines.push({line, boat:a, to: anim.rope_to}); }
  actors.push(a);
  node.userData.actor = a;
}

// ---------- animation
const P = new THREE.Vector3(), T = new THREE.Vector3(), N = new THREE.Vector3(), W1 = new THREE.Vector3(), W2 = new THREE.Vector3();
let last = performance.now()/1000, simT = 0;
function animateActor(a, t, dt){
  const an = a.anim, L = a.limbs, node = a.node, type = an.type;
  if (type === 'none') return;
  if (['walk','run','boat','bridgeboat'].includes(type) && a.path){
    const path = a.path; const seg = an.seg || [0, path.len]; const segLen = Math.max(0.01, seg[1]-seg[0]);
    let d, dir = an.dir || 1, moving = true, facing = dir;
    if (an.period){ let u = (t/an.period + (an.phase||0)); u = u - Math.floor(u); if (dir<0) u = 1-u; d = seg[0] + u*segLen; }
    else {
      const s = (an.start||0) + (an.speed||1)*t*dir;
      if (an.mode === 'pingpong'){ const u = tri(s/segLen); d = seg[0] + u*segLen; facing = (Math.floor(s/segLen)%2===0) ? 1 : -1; if (s<0) facing=-facing; }
      else { let u = (s/segLen) % 1; if (u<0) u+=1; d = seg[0]+u*segLen; }
    }
    a.d = d;
    path.at(d, P, T);
    if (an.offset){ N.set(-T.z, 0, T.x).multiplyScalar(an.offset); P.add(N); }   // lateral offset (positive = left of travel)
    node.position.copy(P);
    if (type === 'bridgeboat'){
      const p = (t/an.period) % 1; const slew = 0.55*Math.pow(Math.sin(Math.PI*p), 3);
      const yaw = Math.atan2(-T.z, T.x) + slew;
      node.quaternion.setFromAxisAngle(AY, yaw); node.position.y += 0.06*Math.sin(t*1.4);
      let m = 0; if (p>0.18 && p<0.32) m = (p-0.18)/0.14; else if (p>=0.32 && p<0.72) m = 1; else if (p>=0.72 && p<0.88) m = 1-(p-0.72)/0.16;
      m = m*m*(3-2*m); if (L.mast){ ZQ.setFromAxisAngle(AZ, 1.45*m); L.mast.quaternion.copy(L.mast.userData.base).multiply(ZQ); }
      a.mastDown = m;
      return;
    }
    if (type === 'boat'){
      let yaw = Math.atan2(-T.z, T.x); if (an.noturn){ yaw = node.userData.yaw0 ?? (node.userData.yaw0 = yaw); } else if (facing<0) yaw += Math.PI;
      node.quaternion.setFromAxisAngle(AY, yaw); node.position.y += 0.07*Math.sin(t*1.3 + a.t0);
      ZQ.setFromAxisAngle(AX, 0.02*Math.sin(t*0.9+a.t0)); node.quaternion.multiply(ZQ);
      if (an.oar && L.oar){ ZQ.setFromAxisAngle(AY, 0.35*Math.sin(t*2.2)); L.oar.quaternion.copy(L.oar.userData.base).multiply(ZQ); }
      return;
    }
    const yaw = Math.atan2(-T.z, T.x) + (facing<0 ? Math.PI : 0);
    const lean = (an.lean||0) + (type==='run' ? 0.15 : 0);
    setYawLean(node, yaw, lean);
    walkLimbs(a, d, an.speed || 1.0, an.gait);
    if (L.wheels) for (const w of L.wheels){ const r = (w.userData.r || JSON.parse(w.userData.anim||'{}').r || 0.8); ZQ.setFromAxisAngle(AZ, -d/r*facing); w.quaternion.copy(w.userData.base).multiply(ZQ); }
    return;
  }
  if (type === 'walk_child'){ const pa = node.parent && node.parent.userData.actor; walkLimbs(a, pa ? pa.d : t, 1.0); return; }
  if (type === 'moored'){ node.position.y = (node.userData.y0 ??= node.position.y) + 0.06*Math.sin(t*1.1 + (an.phase||0)); ZQ.setFromAxisAngle(AX, 0.015*Math.sin(t*0.7+(an.phase||0))); node.quaternion.copy(node.userData.base).multiply(ZQ); return; }
  if (type === 'wheel' || type === 'ride' || type === 'sit' || type === 'squat') return;
  if (type === 'draw_water'){ node.position.y = (node.userData.y0 ??= node.position.y) - 0.5 + 0.5*Math.sin(t*0.8 + (an.phase||0)); return; }
  const ph = a.t0;
  switch(type){
    case 'idle': limbSwing(L.armL, 0.04*Math.sin(t*0.8+ph)); limbSwing(L.armR, 0.04*Math.sin(t*0.8+ph+1)); break;
    case 'talk': limbSwing(L.armR, -0.9-0.35*Math.sin(t*2.3+ph), 0.1*Math.sin(t*1.7)); limbSwing(L.armL, an.big ? -0.7-0.4*Math.sin(t*1.9+ph+1) : 0.05*Math.sin(t*1.1)); ZQ.setFromAxisAngle(AY, (an.big?0.15:0.05)*Math.sin(t*0.9+ph)); node.quaternion.copy(node.userData.base).multiply(ZQ); break;
    case 'watch': { const u = 0.5+0.5*Math.sin(t*0.5+ph); limbSwing(L.armL, -0.4*u); limbSwing(L.armR, -0.2*(1-u)); setLean(node, 0.12*u); break; }
    case 'wave': limbSwing(L.armR, -2.7, 0.45*Math.sin(t*6+ph)); limbSwing(L.armL, -0.5-0.3*Math.sin(t*2+ph)); break;
    case 'point': limbSwing(L.armR, -1.5+0.08*Math.sin(t*1.5+ph)); limbSwing(L.armL, 0.05*Math.sin(t)); break;
    case 'argue': limbSwing(L.armR, -1.3-0.6*Math.sin(t*3.1+ph)); limbSwing(L.armL, -0.9-0.5*Math.sin(t*2.6+ph+2)); setLean(node, 0.1+0.06*Math.sin(t*3)); break;
    case 'throw': { const u = (t*0.45+ph)%1; const k = u<0.3 ? u/0.3 : (u<0.45 ? 1-(u-0.3)/0.15*1.6 : -0.6+0.6*(u-0.45)/0.55); limbSwing(L.armR, -1.0-1.8*k); limbSwing(L.armL, -0.6); setLean(node, 0.15*k); break; }
    case 'bend': setLean(node, 0.45+0.3*Math.sin(t*1.2+ph)); limbSwing(L.armL, -0.8+0.2*Math.sin(t*1.2+ph)); limbSwing(L.armR, -0.8+0.2*Math.sin(t*1.2+ph)); break;
    case 'hammer': { const u = (t*1.6+ph)%1; const k = u<0.25 ? 1-u/0.25 : (u-0.25)/0.75; limbSwing(L.armR, -2.6+1.5*k); setLean(node, 0.25*(1-k)); break; }
    case 'draw': limbSwing(L.armL, -1.3+0.5*Math.sin(t*2.2+(an.phase||0))); limbSwing(L.armR, -1.3-0.5*Math.sin(t*2.2+(an.phase||0))); setLean(node, 0.15); break;
    case 'steer': limbSwing(L.armR, -1.0+0.2*Math.sin(t*0.9+ph)); limbSwing(L.armL, -0.3); ZQ.setFromAxisAngle(AY, 0.08*Math.sin(t*0.9+ph)); node.quaternion.copy(node.userData.base).multiply(ZQ); break;
    case 'pour': { const u = 0.5+0.5*Math.sin(t*0.9+ph); limbSwing(L.armR, -0.4-1.9*u, 0.3*u); limbSwing(L.armL, -0.3-0.6*u); setLean(node, 0.2*u); break; }
    case 'pole': { const u = Math.sin(t*2.0+ph); limbSwing(L.armR, -1.3+0.35*u); limbSwing(L.armL, -1.3+0.35*u); setLean(node, 0.25+0.2*u); break; }
    case 'pull': { const u = Math.sin(t*1.6+ph); limbSwing(L.armR, -1.2+0.3*u); limbSwing(L.armL, -1.2+0.3*u); setLean(node, 0.15+0.25*u); break; }
    case 'scull': { const u = Math.sin(t*2.2); limbSwing(L.armR, -1.1+0.5*u); limbSwing(L.armL, -1.1+0.5*u); setLean(node, 0.15+0.2*u); break; }
    case 'reach': limbSwing(L.armR, -1.4-0.4*Math.sin(t*2.5+ph)); limbSwing(L.armL, -0.6); setLean(node, 0.3); break;
    case 'startle': { const u = Math.max(0, Math.sin(t*1.3+ph)); setLean(node, -0.55*u); for (const k of ['legFL','legFR']) limbSwing(L[k], -0.9*u+0.3*Math.sin(t*9)*u); break; }
    case 'beg': limbSwing(L.armR, -1.1-0.15*Math.sin(t*1.5+ph)); break;
    case 'push': limbSwing(L.armL, -1.0); limbSwing(L.armR, -1.0); setLean(node, 0.2); break;
    case 'write': limbSwing(L.armR, -1.4+0.08*Math.sin(t*5+ph)); limbSwing(L.armL, -1.2); break;
    default: break;
  }
}
function setLean(node, lean){ ZQ.setFromAxisAngle(AZ, -lean); node.quaternion.copy(node.userData.base).multiply(ZQ); }
function walkLimbs(a, d, speed, gait){
  const L = a.limbs, an = a.anim; const cyc = gait==='gallop' ? 2.6 : (L.legFL ? 1.1 : 1.3);
  const ph = 2*Math.PI*d/cyc; const s = Math.sin(ph);
  if (L.legFL){ const A = gait==='gallop' ? 0.75 : 0.35; limbSwing(L.legFL, A*s); limbSwing(L.legBR, A*s); limbSwing(L.legFR, -A*s); limbSwing(L.legBL, -A*s); return; }
  if (L.legL){ limbSwing(L.legL, 0.5*s); limbSwing(L.legR, -0.5*s); }
  const sw = an.swing || 'both'; if (an.pull){ limbSwing(L.armR, -1.2+0.2*s); limbSwing(L.armL, -1.2+0.2*s); return; }
  if (an.carry){ limbSwing(L.armL, -0.3*s); return; }
  if (sw === 'both' || sw === 'L') limbSwing(L.armL, 0.45*s); if (sw === 'both' || sw === 'R') limbSwing(L.armR, -0.45*s);
}
const RT1 = new THREE.Vector3(), RT2 = new THREE.Vector3();
function updateRopes(){
  for (const r of ropeLines){
    const mast = r.boat.limbs.mast; const to = scene.getObjectByName(r.to); if (!mast || !to) continue;
    RT1.set(0, 9.0, 0); mast.localToWorld(RT1); RT2.set(0.6, 1.2, 0); to.localToWorld(RT2);
    const pos = r.line.geometry.attributes.position; pos.setXYZ(0, RT1.x, RT1.y, RT1.z); pos.setXYZ(1, RT2.x, RT2.y, RT2.z); pos.needsUpdate = true; r.line.geometry.computeBoundingSphere();
  }
}

// ---------- camera flights, keyboard
let flight = null;
function flyTo(target, offset, dur=1.6){
  const from = {p: camera.position.clone(), t: controls.target.clone()}; const to = {p: target.clone().add(offset), t: target.clone()};
  flight = {from, to, t0: performance.now()/1000, dur};
}
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase())) stopTour(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
function keyMove(dt){
  const f = new THREE.Vector3(); camera.getWorldDirection(f); f.y = 0; f.normalize(); const r = new THREE.Vector3().crossVectors(f, AY);
  const v = new THREE.Vector3(); const sp = (controls.getDistance()*0.6+6)*dt;
  if (keys.w||keys.arrowup) v.add(f); if (keys.s||keys.arrowdown) v.sub(f); if (keys.d||keys.arrowright) v.add(r); if (keys.a||keys.arrowleft) v.sub(r);
  if (v.lengthSq()>0){ v.normalize().multiplyScalar(sp); camera.position.add(v); controls.target.add(v); }
}

// ---------- vignettes UI
let cur = -1, lang = 'zh', tourTimer = null, labelsOn = true, labelObjs = [];
const $ = id => document.getElementById(id);
function showVignette(i, fly=true){
  if (i<0 || i>=vignettes.length) return; cur = i; const v = vignettes[i];
  $('pZh').textContent = lang==='zh' ? v.zh : v.en; $('pEn').textContent = lang==='zh' ? v.en : v.zh;
  $('pMeta').textContent = (v.cm ? `原卷位置：自卷首约 ${v.cm[0]}${v.cm[1]!==v.cm[0]?'–'+v.cm[1]:''} cm · ` : '') + `区段：${v.zone}`;
  $('pText').textContent = lang==='zh' ? v.desc_zh : v.desc_en; $('pIdx').textContent = `${i+1} / ${vignettes.length}`;
  $('panel').classList.add('show');
  document.querySelectorAll('.mk').forEach((m,k) => m.classList.toggle('on', k===i));
  const f = toV3(v.focus);
  if (fly){ const dist = v.id==='v14' ? 46 : 30; const off = new THREE.Vector3(-dist*0.35, dist*0.85, dist*0.7); flyTo(f, off); }
  const mk = document.querySelectorAll('.mk')[i]; if (mk) mk.scrollIntoView({inline:'center', block:'nearest', behavior:'smooth'});
}
$('btnPrev').onclick = () => { stopTour(); showVignette((cur-1+vignettes.length)%vignettes.length); };
$('btnNext').onclick = () => { stopTour(); showVignette((cur+1)%vignettes.length); };
$('btnTour').onclick = () => { if (tourTimer) stopTour(); else startTour(); };
function startTour(){ $('btnTour').classList.add('on'); showVignette(cur<0?0:cur); tourTimer = setInterval(() => showVignette((cur+1)%vignettes.length), 14000); }
function stopTour(){ if (tourTimer){ clearInterval(tourTimer); tourTimer = null; } $('btnTour').classList.remove('on'); }
$('btnLang').onclick = () => { lang = lang==='zh' ? 'en' : 'zh'; $('btnLang').textContent = lang==='zh' ? 'EN' : '中'; if (cur>=0) showVignette(cur, false); labelObjs.forEach(l => l.element.textContent = lang==='zh' ? l.userData.v.zh : l.userData.v.en); };
$('btnLabels').onclick = () => { labelsOn = !labelsOn; $('btnLabels').classList.toggle('on', labelsOn); labelObjs.forEach(l => l.visible = labelsOn); };
$('btnTop').onclick = () => { stopTour(); flyTo(new THREE.Vector3(0,0,0), new THREE.Vector3(0, 300, 220), 2.2); };
function buildLabels(){
  for (const v of vignettes){ const el = document.createElement('div'); el.className = 'lbl'; el.textContent = v.zh; const lo = new CSS2DObject(el); lo.position.copy(toV3(v.focus)).add(new THREE.Vector3(0, 7, 0)); lo.userData.v = v; scene.add(lo); labelObjs.push(lo); }
}
// scroll strip: painted silk occupies 2.1%..97.9% of the scan width
const SCAN0 = 0.0211, SCAN1 = 0.9792, STRIPW = 4000;
const cmToPx = cm => STRIPW*(SCAN1 - (SCAN1-SCAN0)*cm/528);     // right edge = start of the scroll
const xToCm = x => (186 - x)/0.686;
function buildStrip(){
  const inner = $('stripInner');
  vignettes.forEach((v, i) => { if (!v.cm) return; const m = document.createElement('div'); m.className='mk'; m.style.left = cmToPx((v.cm[0]+v.cm[1])/2)+'px'; if (i%2===0){ const s=document.createElement('span'); s.textContent=v.zh; m.appendChild(s);} m.onclick = e => { e.stopPropagation(); stopTour(); showVignette(i); }; inner.appendChild(m); });
  inner.onclick = e => { const rect = inner.getBoundingClientRect(); const px = e.clientX - rect.left; const cm = (SCAN1 - px/STRIPW)/(SCAN1-SCAN0)*528; const x = 186 - 0.686*Math.max(0, Math.min(528, cm)); stopTour(); let best=-1, bd=1e9; vignettes.forEach((v,i)=>{ const d=Math.abs(v.focus[0]-x); if(d<bd){bd=d;best=i;} }); if (bd<12) showVignette(best); else flyTo(new THREE.Vector3(x, 1, 18), new THREE.Vector3(-14, 18, 26)); };
  $('stripScroll').scrollLeft = STRIPW;
}
// picking
const ray = new THREE.Raycaster(); const mouse = new THREE.Vector2(); let downAt = null;
canvas.addEventListener('pointerdown', e => downAt = [e.clientX, e.clientY]);
canvas.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1])>5) return;
  mouse.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(scene.children, true).filter(h => h.object.isMesh); if (!hits.length) return;
  const p = hits[0].point; const xB = p.x; let best=-1, bd=1e9; vignettes.forEach((v,i)=>{ const d = Math.hypot(v.focus[0]-p.x, -v.focus[1]-p.z); if (d<bd){bd=d;best=i;} });
  if (bd < 22){ stopTour(); showVignette(best, false); }
  let o = hits[0].object; while (o && !o.userData.actor && o.parent) o = o.parent;
  const tip = $('tip'); if (o && o.userData.actor){ const a = o.userData.actor; tip.textContent = `${KIND_ZH[a.kind]||a.kind} · ${ANIM_ZH[a.anim.type]||a.anim.type} · 原卷约 ${Math.round(xToCm(p.x))} cm`; tip.style.display='block'; tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY-10)+'px'; clearTimeout(tip._t); tip._t=setTimeout(()=>tip.style.display='none', 3500); }
});
const KIND_ZH = {worker:'庶民/脚夫',boatman:'船工',porter:'挑夫',vendor:'小贩/店家',scholar:'士人',official:'官员',woman:'妇人',monk:'僧人',child:'孩童',elder:'老者',rich:'富户',donkey:'驴',mule:'骡',horse:'马',ox:'牛',camel:'骆驼',pig:'猪',dog:'狗',boat_cargo:'货船/漕船',boat_passenger:'客船',boat_small:'小船',boat_ferry:'渡船',sedan:'轿子',cart2:'串车/太平车',cart4:'太平车',wheelbarrow:'独轮车'};
const ANIM_ZH = {walk:'行走',run:'奔跑',idle:'站立',talk:'交谈',watch:'观看',wave:'挥手呼喊',point:'指点',argue:'争执',throw:'抛绳',bend:'弯腰劳作',hammer:'敲打',draw:'汲水',steer:'掌舵',pour:'泼水',pole:'撑篙',pull:'拉绳',scull:'摇橹',reach:'伸手拉住',startle:'受惊',beg:'乞讨',push:'推车',write:'记账',sit:'坐',squat:'蹲',ride:'骑乘',moored:'泊岸',boat:'行船',bridgeboat:'过桥',none:'卧',walk_child:'抬轿',draw_water:'打水'};

// ---------- loop
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); labelRenderer.setSize(innerWidth, innerHeight); });
const sunOff = new THREE.Vector3(-60, 110, 80);
function frame(){
  requestAnimationFrame(frame);
  const now = performance.now()/1000; const dt = Math.min(0.05, now-last); last = now; simT += dt; uTime.value = simT;
  if (flight){ const u = Math.min(1, (now-flight.t0)/flight.dur); const k = u*u*(3-2*u); camera.position.lerpVectors(flight.from.p, flight.to.p, k); controls.target.lerpVectors(flight.from.t, flight.to.t, k); if (u>=1) flight = null; }
  keyMove(dt); controls.update();
  for (const a of actors) animateActor(a, simT, dt);
  updateRopes();
  sun.target.position.copy(controls.target); sun.position.copy(controls.target).add(sunOff);
  const camDist = controls.getDistance(); for (const l of labelObjs) l.visible = labelsOn && camDist < 160;
  if (manifest){ const cm = xToCm(controls.target.x); $('cursor').style.left = cmToPx(Math.max(0, Math.min(528, cm)))+'px'; }
  renderer.render(scene, camera); labelRenderer.render(scene, camera);
}
window.__qm = {showVignette, flyTo, scene, camera, controls, actors: () => actors, vignettes: () => vignettes, THREE};
frame();
</script>
